/* protobuf generated code shouldn't be here. consider add a script or a flag in main */

// generate:
// protoc -I$GOPATH/src:. --govalidators_out=:. --go_out=plugins=grpc:. ada.proto

syntax = "proto3";

package ada;

option go_package = "./;v2";

// import "github.com/mwitkow/go-proto-validators/validator.proto";

service ADA {
  // User account management
  rpc Login(LoginReq) returns (LoginReply) {} // Login
  rpc Logout(LogoutReq) returns (LogoutReply) {} // Logout
  rpc ListUser(ListUserReq) returns (ListUserReply) {} // User list
  rpc AddUser(AddUserReq) returns (AddUserReply) {} // Add user
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserReply) {} // Update user profile
  rpc UpdateUserPassword(UpdateUserPasswordReq) returns (UpdateUserPasswordReply) {} // Update user password
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserReply) {} // Delete user
  rpc UserExists(UserExistsReq) returns (UserExistsReply) {} // Check whether the user exists
  // Authority and MFA-related APIs
  rpc CheckMfa(CheckMfaReq)returns(CheckMfaReply) {}// Check whether MFA is required before login
  rpc EnableMfa(EnableMfaReq)returns(EnableMfaReply) {} // Enable MFA
  rpc DisableMfa(DisableMfaReq)returns(DisableMfaReply) {} // Disable MFA
  rpc UpdateAvatar(UpdateAvatarReq)returns (UpdateAvatarReply) {}// Update avatar
  rpc ResetPassword(ResetPasswordReq)returns (ResetPasswordReply) {}// Reset user password

  // AccessKey API key management
  rpc ListAccessKey(ListAccessKeyReq) returns (ListAccessKeyReply) {} // List user AccessKeys
  rpc GenerateAccessKey(GenerateAccessKeyReq) returns (GenerateAccessKeyReply) {} // Generate an AccessKey
  rpc DeleteAccessKey(DeleteAccessKeyReq) returns (DeleteAccessKeyReply) {} // Delete an AccessKey

  // Domain
  rpc ListDomain(ListDomainReq) returns (ListDomainReply) {}  // Domain list
  rpc AddDomain(AddDomainReq) returns (AddDomainReply) {} // Add domain
  rpc TestDomain(TestDomainReq) returns (TestDomainReply) {} // Test the domain connection
  rpc UpdateDomain(UpdateDomainReq) returns (UpdateDomainReply) {} // Update domain configuration
  rpc DeleteDomain(DeleteDomainReq) returns (DeleteDomainReply) {} // Delete domain configuration
  rpc UpdateDomainData(UpdateDomainDataReq)returns (UpdateDomainDataReply) {} // Sync domain data
  rpc DeploySensor(DeploySensorReq) returns (DeploySensorReply) {} // Deploy Sensor(via winRM)

  // sensor
  rpc ListSensor(ListSensorReq) returns (ListSensorReply) {} // Sensor list
  rpc UpdateSensor(UpdateSensorReq) returns (UpdateSensorReply) {} // Update sensor configuration
  rpc DownloadSensor(DownloadSensorReq)  returns (DownloadSensorReply) {}  // Download sensor
  rpc CmdSensor(CmdSensorReq) returns (CmdSensorReply) {}  // Send commands (`start`/`stop`) to a sensor or uninstall it
  rpc UpdateSensorVersion(UpdateSensorVersionReq) returns(UpdateSensorVersionReply) {}// Update the sensor version

  // System information
  // 1. Basic information
  rpc GetSystemInfo(GetSystemInfoReq) returns (GetSystemInfoReply) {} // Get system information
  rpc GetSystemIcon(GetSystemIconReq)returns(GetSystemIconReply) {}
  rpc UpdateSystemLanguage(UpdateSystemLanguageReq)returns(UpdateSystemLanguageReply) {}
  rpc UpdateSystemCfg(UpdateSystemCfgReq) returns (UpdateSystemCfgReply) {} // Update system configuration
  rpc GetSystemProxy(GetSystemProxyReq) returns (GetSystemProxyReply) {} // Get system proxy configuration
  rpc UpdateSystemProxy(UpdateSystemProxyReq) returns (UpdateSystemProxyReply) {} // Update system proxy configuration

  // 2. System metrics: load|cpu|mem|net_rx|net_tx
  rpc GetSystemStats(GetSystemStatsReq) returns (GetSystemStatsReply) {} // Get system metrics
  rpc SetSystemStatsCfg(SetSystemStatsCfgReq) returns (SetSystemStatsCfgReply) {} // Set system metrics parameters; supported keys match `GetSystemInfoReply.statsCfg`

  // 3. License management
  rpc GetLicense(GetLicenseReq) returns (GetLicenseReply) {} // Get the license
  rpc UpdateLicense(UpdateLicenseReq) returns (UpdateLicenseReply) {}  // Update the license

  // 4. Diagnostic tools
  rpc NetworkDebug(NetworkDebugReq)returns(NetworkDebugReply) {} // Diagnostic tool

  // Alert configuration
  rpc ListNotifyConf(ListNotifyConfReq)returns(ListNotifyConfReply) {} // Alert configuration list
  rpc AddNotifyConf(AddNotifyConfReq)returns(AddNotifyConfReply) {} // Add an alert configuration
  rpc UpdateNotifyConf(UpdateNotifyConfReq)returns(UpdateNotifyConfReply) {} // Edit an alert configuration
  rpc DeleteNotifyConf(DeleteNotifyConfReq)returns(DeleteNotifyConfReply) {} // Delete an alert configuration
  rpc EnableNotifyConf(EnableNotifyConfReq)returns(EnableNotifyConfReply){} // Enable or disable a notification configuration
  rpc TestNotifyConf(TestNotifyConfReq)returns(TestNotifyConfReply){} // Test an alert configuration

  // Export management
  rpc ListExportTask(ListExportTaskReq)returns(ListExportTaskReply) {} // Export task list
  rpc AddExportTask(AddExportTaskReq)returns(AddExportTaskReply) {} // Add an export task
  rpc DeleteExportTask(DeleteExportTaskReq)returns(DeleteExportTaskReply) {} // Delete an export task

  // Message center
  rpc ListNotify(ListNotifyReq)returns (ListNotifyReply) {}
  rpc UpdateNotify(UpdateNotifyReq)returns (UpdateNotifyReply) {}
  rpc StatsNotify(StatsNotifyReq)returns(StatsNotifyReply) {}

  // Audit logs
  rpc ListAuditLog(ListAuditLogReq) returns (ListAuditLogReply) {} // Get audit logs

  // System logs
  rpc ListSystemLogs(ListSystemLogsReq) returns (ListSystemLogsReply) {} // Get system error logs

  ////////////////////////////////
  // Threat detection dashboard
  rpc ThreatTops(ThreatTopsReq) returns (ThreatTopsReply) {} // Top 10 threat events and activities
  rpc ThreatTrends(ThreatTrendsReq) returns (ThreatTrendsReply) {} // Threat activity trends

  // Threat detection
  rpc ListThreat(ListThreatReq) returns (ListThreatReply) {} // Threat event list
  rpc GetThreatNames(GetThreatNamesReq) returns (GetThreatNamesReply) {} // Mapping list for `ruleTitle` and `ruleId` in events
  rpc GetThreat(GetThreatReq) returns (GetThreatReply) {} // Threat event details
  rpc ActionThreat(ActionThreatReq) returns (ActionThreatReply) {} // Threat event actions
  rpc ListActivity(ListActivityReq) returns (ListActivityReply) {} // Threat activity list
  rpc GetActivityNames(GetActivityNamesReq) returns (GetActivityNamesReply) {} // Mapping list for threat activity names and `actId`
  rpc GetActivity(GetActivityReq) returns (GetActivityReply) {} // Threat activity details
  rpc ListSensitiveEntry(ListSensitiveEntryReq) returns (ListSensitiveEntryReply) {} // Sensitive entry list
  rpc AddSensitiveEntry(AddSensitiveEntryReq) returns (AddSensitiveEntryReply) {} // Add a sensitive entry
  rpc ListDomainEntry(ListDomainEntryReq) returns (ListDomainEntryReply) {} // Domain user list used when selecting a sensitive entry target
  rpc DeleteSensitiveEntry(DeleteSensitiveEntryReq) returns (DeleteSensitiveEntryReply) {} // Delete a sensitive entry
  rpc ListThreatWhitelist(ListThreatWhitelistReq) returns (ListThreatWhitelistReply) {} // Rule whitelist list
  rpc GetThreatWhitelistField(GetThreatWhitelistFieldReq) returns (GetThreatWhitelistFieldReply) {} // Rule field descriptions
  rpc AddThreatWhitelist(AddThreatWhitelistReq) returns (AddThreatWhitelistReply) {} // Add a rule whitelist entry
  rpc UpdateThreatWhitelist(UpdateThreatWhitelistReq) returns (UpdateThreatWhitelistReply) {} // Update a rule whitelist entry
  rpc DeleteThreatWhitelist(DeleteThreatWhitelistReq) returns (DeleteThreatWhitelistReply) {} // Delete a rule whitelist entry
  rpc ListThreatBlock(ListThreatBlockReq) returns (ListThreatBlockReply) {} // Threat block list
  rpc AddThreatBlock(AddThreatBlockReq) returns (AddThreatBlockReply) {} // Add a block rule
  rpc UpdateThreatBlock(UpdateThreatBlockReq) returns (UpdateThreatBlockReply) {} // Update a block rule
  rpc DeleteThreatBlock(DeleteThreatBlockReq) returns (DeleteThreatBlockReply) {} // Delete a block rule

  // Rule Management (Alert Rules & Activity Rules)
  rpc ListAlertRule(ListAlertRuleReq) returns (ListAlertRuleReply) {} // Alert rule list
  rpc AddAlertRule(AddAlertRuleReq) returns (AddAlertRuleReply) {} // Add an alert rule
  rpc UpdateAlertRule(UpdateAlertRuleReq) returns (UpdateAlertRuleReply) {} // Update an alert rule
  rpc DeleteAlertRule(DeleteAlertRuleReq) returns (DeleteAlertRuleReply) {} // Delete an alert rule
  rpc GetAlertRuleNames(GetAlertRuleNamesReq) returns (GetAlertRuleNamesReply) {} // Return all rule names mapped to their IDs
  rpc GetAlertTypes(GetAlertTypesReq) returns (GetAlertTypesReply) {} // Delete an alert rule
  rpc GetAlertRuleTags(GetAlertRuleTagsReq) returns (GetAlertRuleTagsReply) {} // Get all rule tags
  rpc ListActivityRule(ListActivityRuleReq) returns (ListActivityRuleReply) {} // Sigma rule list
  rpc GetActivityRule(GetActivityRuleReq) returns (GetActivityRuleReply) {} // Get Sigma rule details
  rpc AddActivityRule(AddActivityRuleReq) returns (AddActivityRuleReply) {} // Add a Sigma rule
  rpc UpdateActivityRule(UpdateActivityRuleReq) returns (UpdateActivityRuleReply) {} // Update a Sigma rule
  rpc DeleteActivityRule(DeleteActivityRuleReq) returns (DeleteActivityRuleReply) {} // Delete a Sigma rule
  rpc GetActivityRuleNames(GetActivityRuleNamesReq) returns (GetActivityRuleNamesReply) {} // Return all rule names mapped to their IDs
  rpc GetActivityRuleUniqueFields(GetActivityRuleUniqueFieldsReq) returns (GetActivityRuleUniqueFieldsReply) {} // Get all unique fields used by activity rules
  ////////////////////////////////
  // Scan-risk dashboard
  rpc ScanRiskStats(ScanRiskStatsReq) returns (ScanRiskStatsReply) {} // Active scan event overview
  // Active scan detection
  rpc ListBaseline(ListBaselineReq) returns (ListBaselineReply) {} // Baseline event list
  rpc GetBaseline(GetBaselineReq) returns (GetBaselineReply) {} // Get baseline event details
  rpc ListLeak(ListLeakReq) returns (ListLeakReply) {} // Leak event list
  rpc ListWeakPwd(ListWeakPwdReq) returns (ListWeakPwdReply) {} // Leak event list

  // Task management
  rpc ListScanTask(ListScanTaskReq) returns (ListScanTaskReply) {} // Scan task list
  rpc GetScanTask(GetScanTaskReq) returns (GetScanTaskReply) {} // Get scan task details
  rpc AddScanTask(AddScanTaskReq) returns (AddScanTaskReply) {} // Add a scan task
  rpc RecheckScanTask(RecheckScanTaskReq) returns (RecheckScanTaskReply) {} // Run the scan immediately
  rpc DeleteScanTask(DeleteScanTaskReq) returns (DeleteScanTaskReply) {} // Delete a scan task
  // Scan configuration
  rpc ListScanConf(ListScanConfReq) returns (ListScanConfReply) {} // Scan configuration list
  rpc SetScanConf(SetScanConfReq) returns (SetScanConfReply) {} // Update scan configuration
  rpc GetScanConf(GetScanConfReq) returns (GetScanConfReply) {} // Scan configuration details
  rpc GetScanTmplNames(GetScanTmplNamesReq) returns (GetScanTmplNamesReply) {} // Scan template name list
  rpc UpdateScanConf(UpdateScanConfReq) returns (UpdateScanConfReply) {} // Update configuration details
  // Scan templates
  rpc ListScanTmpl(ListScanTmplReq) returns (ListScanTmplReply) {} // Scan template list
  rpc GetScanTmpl(GetScanTmplReq) returns (GetScanTmplReply) {} // Get scan template details
  rpc UpdateScanTmpl(UpdateScanTmplReq) returns (UpdateScanTmplReply) {} // Update a scan template
  rpc DeleteScanTmpl(DeleteScanTmplReq) returns (DeleteScanTmplReply) {} // Delete a scan template
  rpc AddScanTmpl(AddScanTmplReq) returns (AddScanTmplReply) {} // Add a scan template
  rpc ListScanPlugin(ListScanPluginReq) returns (ListScanPluginReply) {} // Get the scan plugin list

  // Security dashboard
  rpc DashboardStats(DashboardStatsReq) returns (DashboardStatsReply) {} // Dashboard summary metrics
  rpc DashboardTrends(DashboardTrendsReq) returns (DashboardTrendsReply) {} // Dashboard trend charts
  rpc DashboardLogStats(DashboardLogStatsReq) returns (DashboardLogStatsReply) {} // Dashboard winlog/pktlog metrics
}

// common page message struct
message ModelPage {
  int32 pageIdx = 1 ;// start index with 1
  int32 pageSize = 2; // if pageSize is -1, we will return all nodes
  int32 total = 3; // the total number of records
}

message LoginReq {
  string username = 1; // [(validator.field) = {string_not_empty: true}];
  string password = 2; // [(validator.field) = {string_not_empty: true}];
  string totpCode = 3; // [(validator.field) = {regex: "d{6}|^(\\s&&[^\\f\\n\\r\\t\\v])*"}];
}

message LoginReply {
  int32 ID = 1;
  string username = 2;
  string passStrength = 3; // Password strength: high/middle/low
  string role = 4;
  int32 priv = 5;
  string mobile = 6;
  string email = 7;
  string remark = 8;
  string token = 9;
  bool  hasMfa = 10; // Whether MFA is required
  bool needChangePwd = 11; // Whether the password must be changed
}

message LogoutReq {
  string username = 1;
}

message LogoutReply {
  string result = 1;
}


message ListUserReq {
  // start index with 1.
  int32 pageIdx = 1; // [(validator.field) = {int_gt: 0}];
  // if pageSize is -1, we will return all pods.
  int32 pageSize = 2;
  // the fuzzying matching pairs for this query.
  string search = 3;
  //
  bool  isSelf = 4; // `true` when querying the current user profile; `false` when listing sub-users
  repeated string filterRole = 5;  // Roles
  repeated string filterMfaStatus = 6; // MFA status: enable|disable|stop
  repeated string filterPassStrength = 7; // Password strength: high/middle/low
  string filterStartCreateTm = 8; // Creation start time
  string filterEndCreateTm = 9; // Creation end time
  string filterStartPassTm = 10; // Password update start time
  string filterEndPassTm = 11; // Password update end time
  int32 sort = 12; // Sort by creation time (`1` asc, `-1` desc) or password update time (`2` asc, `-2` desc)
}

message ListUserReply {
  ModelPage page = 1;
  message Details {
    int32 ID = 1;
    string username = 2;
    string passStrength = 3; // Password strength: high/middle/low
    string role = 4; // User role: `mgr` super admin | `dev` development | `ops` operations | `sec` security
    int32 priv = 5; // Privilege level: `1` super | `2` admin | `3` guest
    string mobile = 6 ;
    string email = 7 ;
    string remark = 8;
    string createTm = 9;
    bool  hasMfa = 10; // Whether MFA is enabled
    string avatar = 11; // Avatar
    string pwdUpdateTm = 12; // Password update time
    string department = 13; // Department
    string activeTm = 14; // Last active time
    string updateTm = 15; // Update time
  }
  repeated Details List = 2;
  bool exhausted = 3; // if this is last page
}

message AddUserReq {
  string username = 1;
  string password = 2;
  string role = 3;
  string mobile = 4; // [(validator.field) = {regex: "^1[3|4|5|6|7|8|9][0-9]\\d{8}$|^(\\s&&[^\\f\\n\\r\\t\\v])*"}];
  string email = 5; // [(validator.field) = {regex: "\\w+([-+.]\\w+)*@\\w+([-.]\\w+)*\\.\\w+([-.]\\w+)*|^(\\s&&[^\\f\\n\\r\\t\\v])*"}];
  string remark = 6;
  string department = 9; // Department
}

message AddUserReply {
  string result = 1;
}

message UpdateUserReq {
  string username = 1;
  string mobile = 2; // [(validator.field) = {regex: "^1[3|4|5|6|7|8|9][0-9]\\d{8}$|^(\\s&&[^\\f\\n\\r\\t\\v])*"}];
  string email = 3; // [(validator.field) = {regex: "\\w+([-+.]\\w+)*@\\w+([-.]\\w+)*\\.\\w+([-.]\\w+)*|^(\\s&&[^\\f\\n\\r\\t\\v])*"}];
  string remark = 4;
  string role = 5; // Optional; a super user can change the role for any username
  string department = 8; // Department
}

message UpdateUserReply {
  string result = 1;
}

message UpdateUserPasswordReq {
  string oldPassword = 1;
  string newPassword = 2;
  string username = 3; // Optional; a super user can change the password for any username
}

message UpdateUserPasswordReply {
  string result = 1;
}

message DeleteUserReq {
  string username = 1;
}

message DeleteUserReply {
  string result = 1;
}

message UserExistsReq {
  string username = 1;
}
message UserExistsReply {
  bool result = 1;
}


message CheckMfaReq {
  string username = 1;
  string password = 2;
}

message CheckMfaReply {
  bool hasMfa = 1;
}

message EnableMfaReq {
  string username = 1;
  string password = 2;
  string secret = 3;
  string mfaCode = 4; // [(validator.field) = {length_eq: 6}];
}

message EnableMfaReply {
  string result = 1; // SUCCESS || FAILED
}

message DisableMfaReq {
  string username = 1;
}

message DisableMfaReply {
  string result = 1; // SUCCESS || FAILED
}

message UpdateAvatarReq {
  int32 userId = 1;
  string file = 2;
}

message UpdateAvatarReply {
  string result = 1; //  success failed
}

message ResetPasswordReq {
  string username = 1;
  string newPassword = 2; // [(validator.field) = {length_gt: 11}];
}

message ResetPasswordReply {
  string result = 2;
}

// AccessKey
message ListAccessKeyReq {
  string username = 1; // Username; leave empty to list all AccessKeys (admin only)
}

message AccessKeyDetails {
  string iD = 1; // ID
  string username = 2; // Owner username
  string secretKey = 4; // SecretKey (masked: sk-xx*****xxx)
  string remark = 5; // Remark
  string status = 6; // Status: active|disabled
  string createTm = 7; // Creation time
  string updateTm = 8; // Update time
  string activeTm = 9; // Last used time
}

message ListAccessKeyReply {
  repeated AccessKeyDetails list = 1;
}

message GenerateAccessKeyReq {
  string username = 1; // [(validator.field) = {length_gt: 0}]; // Username
  string remark = 2; // Remark
}

message GenerateAccessKeyReply {
  string result = 1; // success|fail
  string secretKey = 3; // Generated secret key in plain text; returned only in this response
  string message = 4; // Error message
}

message DeleteAccessKeyReq {
  string iD = 1; // [(validator.field) = {length_gt: 0}]; // AccessKey ID
}

message DeleteAccessKeyReply {
  string result = 1; // success|fail
  string message = 2; // Error message
}

// Domain
message ListDomainReq {
  int32 pageIdx = 1; // [(validator.field) = {int_gt: 0}];
  // if pageSize is -1, we will return all pods.
  int32 pageSize = 2;
  string filterDomain = 3; // Filter by domain
  string filterStatus = 4; // Filter by domain status
  string filterKeyword = 5; // Search by keyword
}

message ListDomainReply {
  ModelPage page = 1;
  message dcList {
    string hostname = 1;
    string platform = 2;
    string version = 3;
    string ips = 4;
    string timeout = 5;
    string status = 6;
    bool hasSensor = 7;
    bool isMaster = 8;
    string fsmoRole = 9;
    string errMsg = 10;
    string lastOnlineTm = 11;
  }
  message Details {
    string ID = 1;
    string name = 2;
    string dcHostname = 3;
    string status = 4;
    map <string, string> domainInfo = 5;
    string createTm = 6;
    string errMsg = 7;
    repeated dcList DCs = 8;
  }
  repeated Details List = 2;
  bool exhausted = 3; // if this is last page
}

message AddDomainReq {
  string ldapAddr = 1;
  string username = 2;
  string password = 3;
  string DNS = 4; // [(validator.field) = {regex: "^((0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])\\.){3}(0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])$|^(\\s&&[^\\f\\n\\r\\t\\v])*"}]; //Optional
}
message AddDomainReply {
  string result = 1;
}

message TestDomainReq {
  string ldapAddr = 1;
  string username = 2;
  string password = 3;
  string DNS = 4; // [(validator.field) = {regex: "^((0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])\\.){3}(0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])$|^(\\s&&[^\\f\\n\\r\\t\\v])*"}]; //Optional
}
message TestDomainReply {
  int32 status = 1; // `1` for success and `0` for failure
  string msg = 2; // Error message
}

message UpdateDomainReq {
  string ID = 1;
  string ldapAddr = 2;
  string username = 3;
  string password = 4;
  string DNS = 5; // [(validator.field) = {regex: "^((0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])\\.){3}(0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])$|^(\\s&&[^\\f\\n\\r\\t\\v])*"}]; //Optional
}
message UpdateDomainReply {
  string result = 1;
}

message DeleteDomainReq {
  string ID = 1;
  string Name = 2;
}

message DeleteDomainReply {
  string result = 1;
}

message UpdateDomainDataReq {
  string domainID = 1;// Domain ID
}

message UpdateDomainDataReply {
  string result = 1;//  success failed
}

message DeploySensorReq {
  string domainID = 1; // Domain ID
  string dcHostname = 2; // DC Hostname
}

message DeploySensorReply {
  string result = 1; //  success | failed
}

message ListSensorReq {
  int32 pageIdx = 1; // [(validator.field) = {int_gt: 0}];
  int32 pageSize = 2;
  repeated string domain = 3; // filter: domain
  repeated string status = 4; // filter: Init|Running|Stopped
  string keyword = 5; // for search
  int32 tmSort = 6; // Sort by last online time: `1` asc, `-1` desc
}

message ListSensorReply {
  message mapSlice {
    map<string, string> event = 1;
  }

  ModelPage page = 1;
  message Details {
    string ID = 1;
    string IP = 2 ;
    string hostname = 3;
    string domain = 4 ;
    string status = 5; // Runtime status
    string version = 6;
    string newVersion = 7; // Available sensor version
    string pktStatus = 8; // Packet collection status: Init|Running|Stopped|Error
    string logStatus = 9; // Log collection status: Init|Running|Stopped|Error
    string sensorTime = 10; // Current host timestamp used for time calibration
    string remark = 11;    // Remark

    string pktPluginSwitch = 12;   // Packet plugin switch: true|false
    string logPluginSwitch = 13;    // Log plugin switch: true|false
    string rpcFwPluginSwitch = 14;   // rpcfw plugin switch: true|false
    string ldapFwPluginSwitch = 15;  // ldapfw plugin switch: true|false
    string pktPluginStatus = 16;     // Packet plugin status: Init|Running|Stopped|Error
    string logPluginStatus = 17;     // Log plugin status: Init|Running|Stopped|Error
    string rpcFwPluginStatus = 18;   // rpcfw plugin status: Init|Running|Stopped|Error
    string ldapFwPluginStatus = 19;  // ldapfw plugin status: Init|Running|Stopped|Error
    string rpcFWCpuUsed = 20;
    string rpcFWMemUsed = 21;
    string ldapFwCpuUsed = 22;
    string ldapFwMemUsed = 23;
    string sensorCpuUsed = 24;
    string sensorMemUsed = 25;

    string platform = 26; // Domain controller platform
    string kernelVer = 27; // Domain controller kernel version
    string memTotal = 28; // Domain controller memory size
    string cpuTotal  = 29; // CPU core count
    map<string, string> netIface = 30; // Host network interfaces, for example `{ "eth0": "ip1,ip2" }`
    repeated string bindNetIface = 31; // Bound interface list, for example `["eth0", "eth1"]`
    int32 dcIntervalTm = 32; // Difference between domain-controller time and server time in seconds

    map<string, string> perfLimit = 33; // Resource usage limits
    repeated mapSlice events = 34; // Runtime logs

    string createTm = 35; // Added time
    string lastOnlineTm = 36; // Last online time
    string LastCollectTm = 37;// Last collection time
  }
  repeated Details List = 2;
  bool exhausted = 3; // if this is last page
}

message UpdateSensorReq {
  string ID = 1;
  repeated string bindNetIface = 2; // Return the original value if unchanged
  map<string, string> perfLimit = 3; // Return the original value if unchanged, {"limit_mem_max":"0.05", "limit_cpu_max":"0.06"}
  string remark = 4;// Return the original value if unchanged
  string pktPluginSwitch = 5; // [(validator.field) = {regex: "true|false"}]; // Leave blank if unchanged
  string logPluginSwitch = 6; // [(validator.field) = {regex: "true|false"}];  // Leave blank if unchanged
  string rpcFwPluginSwitch = 7; // [(validator.field) = {regex: "true|false"}];  // Leave blank if unchanged
  string ldapFwPluginSwitch = 8; // [(validator.field) = {regex: "true|false"}];  // Leave blank if unchanged
}

message UpdateSensorReply {
  string result = 1;
}

message DownloadSensorReq {
  string Type = 1; // [(validator.field) = {regex: "x64|x86"}]; // x64 x86
}

message DownloadSensorReply {
  string path = 1;
}

message CmdSensorReq {
  string ID = 1;
  string cmd = 2; // [(validator.field) = {regex: "delete|uninstall"}]; // delete|uninstall
}

message CmdSensorReply {
  string result = 1;
}

message UpdateSensorVersionReq {
  string sensorId = 1;
  string version = 2;
}
message UpdateSensorVersionReply {
  string result = 1; //  success failed
}

message GetSystemInfoReq {}

message GetSystemInfoReply {
  string systemIP = 1;
  string systemName = 2; // System name
  string systemIcon = 3; // Logo
  string systemVersion = 4; // System version
  string systemInstallTm = 5; // Installation time
  string systemUpgradeTm = 6; // Last upgrade time
  string systemCpuTotal = 7; // 4C
  string systemMemTotal = 8; // 16GB
  string systemDiskTotal = 9; // 64GB
  string systemLoadAverage = 10; // System load, local_15m
  string systemBootTime = 11; // Uptime
  string systemEsHealth = 12; // Elasticsearch health: green/yellow/red
  string systemTimestamp = 13; // System time
  string systemNtpAddress = 14; // NTP server address
  string systemLanguage = 15; // System language (EN/ZH)
  map<string, string> statsCfg = 16; // System metrics parameters
  string upgradeSrv = 17; // Upgrade server address
  string upgradeRule = 18; // Upgrade policy switch: "true|false"
  string currentRuleVer = 19; // Current rule version
  string cloudRuleVer = 20; // Cloud rule version
  SystemProxyInfo systemProxy = 21; // System proxy configuration
}

message GetSystemIconReq {}
message GetSystemIconReply {
  string icon = 1;
}

message UpdateSystemLanguageReq{
  string language = 1; // [(validator.field) = {regex: "EN|ZH"}]; // EN/ZH
}
message UpdateSystemLanguageReply{
  string result = 1; //  success failed
}

//
message UpdateSystemCfgReq{
  string ntp = 1; // ntp server
