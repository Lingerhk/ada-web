// Alert Rule (Flow Rules) Messages
message ListAlertRuleReq {
  int32 pageIdx = 1; // [(validator.field) = {int_gt: 0}];
  int32 pageSize = 2;
  repeated int32 level = 3; // Rule level: `5` critical, `4` high, `3` medium, `2` low, `1` info
  repeated string status = 4; // Rule status: `test|experimental|stable|deprecated`
  bool enable = 5; // Enable state
  string keyword = 6; // Keyword search across title and description
  repeated string tags = 7; // Tag filter
  int32 sortTm = 8; // Sort by time: `1` asc, `-1` desc
}

// define AttackFlow
message AttackFlowReply{ // Attack flow graph definition
  message Field {
    string obj = 1; // Supported types: ip|user|computer|dc
    string key = 2; // Example: `$1.TargetUsername`
    string value = 3; // only used at threat api
  }
  string desc = 1;
  repeated Field fields = 2;
  repeated string relates = 3;
}

message AlertRuleInfo {
  string ID = 1;
  string title = 2; // Rule title
  string description = 3; // Rule description
  bool enable = 4; // Enable state
  int32 level = 5; // Threat level
  string status = 6; // Rule status
  repeated string tags = 7; // Tags
  string logsource = 8; // Log source
  string detection = 9; // Yaml string
  string type = 10; // Rule category
  string author = 11; // Author
  repeated string references = 12; // References
  string suggestion = 13; // Handling suggestions
  bool autoBlock = 14; // Automatic blocking
  AttackFlowReply attackFlow = 15;
  repeated string uniqueFilter = 16; // Uniqueness filter
  string createTm = 17;
  string updateTm = 18;
}

message ListAlertRuleReply {
  ModelPage page = 1;
  repeated AlertRuleInfo rules = 2;
}

